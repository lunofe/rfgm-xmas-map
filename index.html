<!DOCTYPE html>
<html lang="de" data-theme="dark">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>RFGM Xmas Map</title>
        <meta property="og:title" content="Refugium.me Weihnachtsserver Karte">
        <meta name="description" content="Wirf einen Blick auf die gesamte Karte des Weihnachtsservers, inklusive Markierungen für die wichtigsten Orte und beinahe alle Spieler!">
        <meta property="og:description" content="Wirf einen Blick auf die gesamte Karte des Weihnachtsservers, inklusive Markierungen für die wichtigsten Orte und beinahe alle Spieler!">

        <link rel="icon" type="image/webp" href="assets/emoji/favicon.webp">
        <meta property="og:image" content="https://rfgm.lunofe.com/assets/emoji/favicon.webp">
        <meta name="theme-color" content="#365083">

        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/leaflet.css">
        <link rel="stylesheet" href="assets/css/snow.css">
    </head>

    <body>
        <div class="snow"></div>
        <div id="map"></div>
        <div id="control">
            <div>
                <span id="replay" onclick="toggle_replay()">🔁</span>
                <select onchange="update_map_image()" id="day"></select>
                <select onchange="map_data_switch()" id="year">
                    <option value="2025">2025 (Gipfelbach)</option>
                    <option value="2024">2024 (Lichtertal)</option>
                    <option value="2023">2023 (Tannberg)</option>
                </select>
            </div>
            <input type="text" id="search_input" placeholder="Suche nach Orten und Spielern..." />
            <div id="search_results"></div>
        </div>

        <!-- libraries -->
        <script src="assets/js/leaflet.js"></script>
        <script src="assets/js/turf.js"></script>

        <!-- utils (must load before mapdata) -->
        <script src="assets/js/utils.js"></script>

        <!-- map data -->
        <script src="assets/js/mapdata/gipfelbach.js"></script>
        <script src="assets/js/mapdata/tannberg.js"></script>
        <script src="assets/js/mapdata/lichtertal.js"></script>

        <!-- main logic -->
        <script src="assets/js/map-setup.js"></script>
        <script src="assets/js/search.js"></script>
        <script src="assets/js/map-switch.js"></script>

        <!-- initialize -->
        <script>map_data_switch();</script>

        <!-- devtools (must load after map_data_switch) -->
        <script src="assets/js/devtools.js"></script>
    </body>

</html>
